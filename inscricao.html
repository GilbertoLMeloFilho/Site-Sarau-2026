<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Inscrição — Sarau Literário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="page-header">
    <a class="back-link" href="index.html" aria-label="Voltar">&lt;</a>
    <h1>Inscrição</h1>
  </header>

  <main class="form-wrap">
    <form class="form-card" action="#" method="post" data-sheet="Inscricao">

      <div class="form__group field">
          <label for="nome" class="form__label">Nome</label>
          <input type="text" id="nome" name="nome" class="form__field" placeholder=" " required>
      </div>

      <div class="form__group field">
          <label for="telefone" class="form__label">Telefone</label>
          <input type="tel" id="telefone" name="telefone" class="form__field" placeholder=" " required>
      </div>

      <div class="field-row field-row-serie">
      <label for="serie">Série:</label>
      <select class="serie" name="serie">
          <option value="">6°Ano</option>
          <option value="">7°Ano</option>
          <option value="">8°Ano</option>
          <option value="">9°Ano</option>
          <option value="">1°Ano</option>
          <option value="">2°Ano</option>
          <option value="">3°Ano</option>
      </select>

        <div class="field checkbox-field">
          <label for="ap-turma">Ap. de Turma:</label>
          <label class="container">
            <input type="checkbox" id="ap-turma" name="ap-turma">
            <div class="checkmark"></div>
          </label>
        </div>
      </div>

      <div class="form__group field">
    <label for="musica" class="form__label">Música</label>

    <input
        type="text"
        id="musica"
        name="musica"
        class="form__field"
        placeholder=" "
        required
    >
</div>

      <div class="field">
        <label for="num-participantes">Número de Participantes</label>
        <input type="number" id="num-participantes" name="num-participantes" required>
      </div>

      <div class="form__group field" style="display: none;" id="caixa_nome_part">
          <label for="nome-participantes" class="form__label">Nome Participantes</label>
          <input type="text" id="nome-participantes" name="nome-participantes" class="form__field" placeholder=" ">
      </div>

      <div class="form__group field">
          <label for="apresentacao" class="form__label">Apresentação</label>
          <input type="text" id="apresentacao" name="apresentacao" class="form__field" placeholder=" " required>
      </div>

      <div class="field">
        <label for="anexar-musica">Anexar musica</label>
        <input type="file" id="anexar-musica" name="anexar-musica">
      </div>

      <div class="btn-enviar-wrap">
        <button type="submit" class="btn-enviar">Enviar</button>
      </div>

    </form>
        <!-- Popup de envio -->
    <div id="popup" class="popup">
      <div class="popup-conteudo">

        <button id="fecharPopup" class="fechar-popup" type="button">
          ✕
        </button>
        <div id="container_img_pop">
          <img src="aceitar.png" alt="correto" id="correto">
        </div>
        <div id="loading" class="spinner"></div>

        <p id="mensagem">Enviando...</p>

      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footers">
      <p>Sarau 2026</p>
      <a href="https://www.instagram.com/2daoima2026/">
        <div class="inst">
          <p>Instagram</p>
          <img src="instagram.png" alt="Logo_instagram" class="Logo_instagram">
        </div>
      </a>
    </div>
  </footer>
  <script>
    const params = new URLSearchParams(window.location.search);
    const musicaURL = params.get("musica");

    console.log("Música encontrada:", musicaURL);

    const campoMusica = document.getElementById("musica");

    if (campoMusica && musicaURL) {
        campoMusica.value = musicaURL;
    }
</script>

</body>
  <script src="script.js" defer></script>
</body>
</html>

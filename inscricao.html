<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Inscrição — Sarau Literário</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="page-header">
    <a class="back-link" href="index.html" aria-label="Voltar">&lt;</a>
    <h1>Inscrição</h1>
  </header>

  <main class="form-wrap">
    <form class="form-card" action="#" method="post" data-sheet="Inscricao">

      <div class="form__group field">
          <label for="nome" class="form__label">Nome</label>
          <input type="text" id="nome" name="nome" class="form__field" placeholder=" " required>
      </div>

      <div class="form__group field">
          <label for="telefone" class="form__label">Telefone</label>
          <input type="tel" id="telefone" name="telefone" class="form__field" placeholder=" " required>
      </div>

      <div class="field-row field-row-serie">
        <div class="field field-serie">
          <label for="serie">Serie:</label>
          <input type="text" id="serie" name="serie">
        </div>
        <div class="field checkbox-field">
          <label for="ap-turma">Ap. de Turma:</label>
          <label class="container">
            <input type="checkbox" id="ap-turma" name="ap-turma">
            <div class="checkmark"></div>
          </label>
        </div>
      </div>

      <div class="form__group field">
          <label for="musica" class="form__label">Música</label>
          <input type="text" id="musica" name="musica" class="form__field" placeholder=" " required>
      </div>

      <div class="field">
        <label for="num-participantes">Número de Participantes</label>
        <input type="number" id="num-participantes" name="num-participantes">
      </div>

      <div class="form__group field" style="display: none;" id="caixa_nome_part">
          <label for="nome-participantes" class="form__label">Nome Participantes</label>
          <input type="text" id="nome-participantes" name="nome-participantes" class="form__field" placeholder=" ">
      </div>

      <div class="form__group field">
          <label for="apresentacao" class="form__label">Apresentação</label>
          <input type="text" id="apresentacao" name="apresentacao" class="form__field" placeholder=" " required>
      </div>

      <div class="field">
        <label for="anexar-musica">Anexar musica</label>
        <input type="file" id="anexar-musica" name="anexar-musica">
      </div>

      <div class="btn-enviar-wrap">
        <button type="submit" class="btn-enviar">Enviar</button>
      </div>

    </form>
        <!-- Popup de envio -->
    <div id="popup" class="popup">
  <div class="popup-conteudo">

    <button id="fecharPopup" class="fechar-popup" type="button">
      ✕
    </button>

    <div id="loading" class="spinner"></div>

    <p id="mensagem">Enviando...</p>

  </div>
</div>
  </main>

  <footer class="site-footer">
    Sarau 2026
  </footer>

  <script src="js/script.js" defer></script>
</body>
</html>

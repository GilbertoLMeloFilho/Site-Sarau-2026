<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Inscrição — Sarau Literário</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="page-header">
    <a class="back-link" href="index.html" aria-label="Voltar">&lt;</a>
    <h1>Inscrição</h1>
  </header>

  <main class="form-wrap">
    <form class="form-card" action="#" method="post">

      <div class="field">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome">
      </div>

      <div class="field">
        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone">
      </div>

      <div class="field-row field-row-serie">
        <div class="field field-serie">
          <label for="serie">Serie:</label>
          <input type="text" id="serie" name="serie">
        </div>
        <div class="field checkbox-field">
          <label for="ap-turma">Ap. de Turma:</label>
          <input type="checkbox" id="ap-turma" name="ap-turma">
        </div>
      </div>

      <div class="field">
        <label for="musica">Música:</label>
        <input type="text" id="musica" name="musica">
      </div>

      <div class="field">
        <label for="num-participantes">Número de Participantes</label>
        <input type="number" id="num-participantes" name="num-participantes">
      </div>

      <div class="field">
        <label for="nome-participantes">Nome dos participantes:</label>
        <input type="text" id="nome-participantes" name="nome-participantes">
      </div>

      <div class="field">
        <label for="apresentacao">Apresentação:</label>
        <input type="text" id="apresentacao" name="apresentacao">
      </div>

      <div class="field">
        <label for="anexar-musica">Anexar musica</label>
        <input type="file" id="anexar-musica" name="anexar-musica">
      </div>

      <div class="btn-enviar-wrap">
        <button type="submit" class="btn-enviar">Enviar</button>
      </div>

    </form>
  </main>

  <footer class="site-footer">
    Sarau 2026
  </footer>

</body>
</html>

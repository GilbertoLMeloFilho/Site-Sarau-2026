<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Desenho — Sarau Literário</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="page-header">
    <a class="back-link" href="index.html" aria-label="Voltar">&lt;</a>
    <h1>Desenho</h1>
  </header>

  <main class="form-wrap">
    <form class="form-card" action="#" method="post">

      <div class="field">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome">
      </div>

      <div class="field">
        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="serie">Serie:</label>
          <input type="text" id="serie" name="serie">
        </div>
        <div class="field">
          <label for="categoria">Categoria:</label>
          <input type="text" id="categoria" name="categoria">
        </div>
      </div>

      <div class="field">
        <label for="anexar-arquivo" class="label-center">Anexar arquivo:</label>
        <input type="file" id="anexar-arquivo" name="anexar-arquivo" class="file-box">
      </div>

      <div class="btn-enviar-wrap">
        <button type="submit" class="btn-enviar">Enviar</button>
      </div>

    </form>
  </main>

  <footer class="site-footer">
    Sarau 2026
  </footer>

</body>
</html>
